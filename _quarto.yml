project:
  type: book
  output-dir: docs

book:
  title: "The Wiryadana's Notebook"
  author: "Kadek Adit Wiryadana"
  search: true
  repo-url: https://github.com/wiryadana/the_wiryadana_notebooks
  downloads: pdf
  sharing: [twitter, linkedin, facebook]
  date: today
  chapters:
    - index.qmd
    - intro.qmd
    - part: internal_medicine.qmd
      chapters: 
        - critical_care.qmd
        - hematology_oncology.qmd
        - allergy_imunology.qmd
        - rheumatology.qmd
        - infectious_disease.qmd
        - cardiology.qmd
        - respirology.qmd
        - nefrology.qmd
        - gastroenterology_hepatology.qmd
        - endocrine_metabolism.qmd
        - psychosomatic.qmd
        - geriatry.qmd
    - part: others.qmd
      chapters:
        - clinical_nutrition.qmd
        - surgery.qmd
        - neurology.qmd
        - anesthesiology.qmd
        - obgyn.qmd
        - dermatology.qmd
        - poison_drugs.qmd
        - enviromental.qmd
        - travel_medicine.qmd
        - radiology.qmd
        - anatomical_pathology.qmd
        - clinical_pathology.qmd
        - clinical_microbiology.qmd
        - ent.qmd
        - ophtalmology.qmd
        - rehabilitation.qmd
        - disaster.qmd
    - pharmacology.qmd
    - medical_procedure.qmd
    - part: bioinformatics.qmd
      chapters: 
        - genomic_medicine.qmd
        - linux_programming.qmd
    - part: statistics.qmd
      chapters: 
        - basic_r.qmd
        - tidyverse_ggplot.qmd
    - part: mkdu.qmd
      chapters: 
        - biomol.qmd
        - metpen.qmd
        - filsum.qmd
        - statistik.qmd
        - ebm.qmd
        - tugasmkdu.qmd
    - references.qmd
  page-navigation: true
  sidebar: 
    style: docked
    background: dark
  
bibliography: references.bib
execute: 
  echo: false

format:
  html:
    theme: 
      light: zephyr   # Tema flatly/litera/zephyr seringkali lebih elegan untuk teks panjang
      dark: darkly       # Berikan opsi dark mode pembaca
    fontsize: 1.1em      # Sedikit membesarkan ukuran font dasar
    linestretch: 1.6     # Memberikan jarak antar baris agar paragraf tidak menumpuk
    toc: true
    toc-depth: 3
    toc-title: "Daftar Isi Bab"
  pdf:
    documentclass: scrreprt
    include-in-header: 
      text: |
        \usepackage{makeidx}
        \makeindex
    include-after-body: 
      text: |
        \printindex

editor: visual

